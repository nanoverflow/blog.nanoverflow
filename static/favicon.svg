<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8">
  <!-- Jy pixel logo (7x4 grid), same colors as .jy-logo in style.css.
       Canvas 8x8 square; logo occupies x 0.5-7.5, y 2-6. -->
  <g shape-rendering="crispEdges">
    <!-- J: coral top bar (cells 1-3) -->
    <rect x="0.5" y="2" width="3" height="1" fill="#e48a7a"/>
    <!-- J: blue stem + hook (cells 10, 17, 22-24) -->
    <rect x="2.5" y="3" width="1" height="2" fill="#4f8eb3"/>
    <rect x="0.5" y="5" width="3" height="1" fill="#4f8eb3"/>
    <!-- y: yellow stems, join, descender (cells 5, 7, 12, 14, 19-21, 28) -->
    <rect x="4.5" y="2" width="1" height="1" fill="#eab65d"/>
    <rect x="6.5" y="2" width="1" height="1" fill="#eab65d"/>
    <rect x="4.5" y="3" width="1" height="1" fill="#eab65d"/>
    <rect x="6.5" y="3" width="1" height="1" fill="#eab65d"/>
    <rect x="4.5" y="4" width="3" height="1" fill="#eab65d"/>
    <rect x="6.5" y="5" width="1" height="1" fill="#eab65d"/>
  </g>
</svg>

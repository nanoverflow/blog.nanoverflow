<header class="site-header">
  <div class="session">
    {{ partial "jy-logo.html" . }}
    <div class="wordmark">
      <span class="wm-1">J</span><span class="wm-2">y</span>
      <span class="hostname">— {{ .Site.Title }}</span>
    </div>
  </div>

  <nav class="menu" aria-label="main">
    {{ $cur := . }}
    {{ range .Site.Menus.main }}
    <a href="{{ .URL | relURL }}"{{ if or ($cur.IsMenuCurrent "main" .) (and $cur.IsHome (eq .Name "Home")) }} class="active"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>

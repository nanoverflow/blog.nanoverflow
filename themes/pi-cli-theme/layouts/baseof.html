<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  {{ $desc := .Site.Params.description }}
  {{ with .Params.description }}{{ $desc = . }}{{ end }}
  {{ with $desc }}<meta name="description" content="{{ . }}">{{ end }}
  <meta name="generator" content="hugo {{ hugo.Version }} · pi-cli-theme">
  <script>
  /* set theme before first paint: stored pref > system > dark (like pi's light/dark auto mode) */
  (function () {
    var t = null;
    try { t = localStorage.getItem('pi-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/syntax.css" | relURL }}">
  {{ partial "head_custom.html" . }}
</head>

<body>
  {{ partial "header.html" . }}

  <main class="terminal">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>

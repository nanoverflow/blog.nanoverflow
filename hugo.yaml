baseurl: "https://blog.nanoverflow.com/"  # please update this to your actual URL
locale: "en-us"
title: "NaNOverflow's blog"
theme: "pi-cli-theme"
googleAnalytics: ""
disqusShortname: ""
ignoreFiles: ["_cache$"]
footnotereturnlinkcontents: "↩"

outputFormats:
  search:
    mediaType: "application/json"
    baseName: "searchindex"
    isPlainText: true
    notAlternative: true

outputs:
  home: ["HTML", "RSS", "search"]

permalinks:
  post: "/post/:year/:slug/"
  column: "/column/:year/:slug/"

menu:
  main:
    - name: Home
      url: ""
      weight: 1
    - name: Columns
      url: "column/"
      weight: 2
    - name: Categories
      url: "categories/"
      weight: 3
    - name: Tags
      url: "tags/"
      weight: 4
    - name: Search
      url: "search/"
      weight: 5
    - name: About
      url: "about/"
      weight: 6

params:
  description: "NaNOverflow's blog"
  footer: "&copy; [Yan](https://blog.nanoverflow.com) 2026 -- {Year} | [Github](https://github.com/nanoverflow)"

security:
  allowContent: ['.*']

markup:
  highlight:
    codeFences: true
    style: "onedark" # unused with noClasses:false; token colors come from themes/pi-cli-theme/static/css/syntax.css (dark: onedark, light: github)
    lineNos: false
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
